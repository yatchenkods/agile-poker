# Production values for agile-poker Helm chart
# Usage: helm install agile-poker ./helm -f helm/examples/values-production.yaml

namespace: agile-poker-prod

# Backend application image configuration
image:
  repository: yatchenkods/agile-poker
  tag: "1.0.0"  # Specify exact version in production
  pullPolicy: IfNotPresent

# Number of backend replicas
replicaCount: 3

# Backend resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Backend service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 3
  image:
    repository: yatchenkods/agile-poker-frontend
    tag: "1.0.0"  # Specify exact version in production
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  healthCheck:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  # Production runtime configuration for frontend
  # These values are injected at runtime via environment variables
  env:
    # Public API endpoint - must be accessible from browser
    # Use the full URL including protocol
    REACT_APP_API_URL: "https://api.agile-poker.com"
    # WebSocket endpoint for real-time updates
    # Use wss:// for production with SSL
    REACT_APP_WS_URL: "wss://api.agile-poker.com"
    # Enable Jira integration in production
    REACT_APP_JIRA_ENABLED: "true"
    # Logging level: info for production (less verbose)
    REACT_APP_LOG_LEVEL: "info"

# Ingress configuration (serves both backend and frontend)
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: agile-poker.com
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls:
    - secretName: agile-poker-tls
      hosts:
        - agile-poker.com

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: agile_user
    password: "changeme123"  # MUST be changed in production!
    database: agile_poker
  primary:
    persistence:
      enabled: true
      size: 50Gi  # Larger in production
      storageClassName: "ssd"  # Use SSD storage class
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "changeme123"  # MUST be changed in production!
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: "ssd"
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: "ssd"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Backend environment variables
env:
  LOG_LEVEL: "INFO"  # Less verbose in production
  WORKERS: "8"  # More workers in production
  DATABASE_POOL_SIZE: "20"
  CORS_ORIGINS: "https://agile-poker.com"  # Restrict CORS in production
  JWT_SECRET: "your-secret-key-change-in-production"  # MUST be changed!
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  JIRA_ENABLED: "true"
  SESSION_TIMEOUT_MINUTES: "60"
  REDIS_ENABLED: "true"
  REDIS_MAX_CONNECTIONS: "100"

# Secrets (mount as environment variables)
secrets:
  jiraApiToken: ""  # Set your Jira API token
  databasePassword: "changeme123"  # MUST match postgresql.auth.password
  redisPassword: "changeme123"  # MUST match redis.auth.password

# Backend health check configuration
healthCheck:
  enabled: true
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

# Pod annotations for monitoring
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Node selector for pod scheduling (use production nodes)
nodeSelector:
  workload: production

# Tolerations for node taints
tolerations:
  - key: "production"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# Pod affinity rules for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - backend
          topologyKey: kubernetes.io/hostname

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
