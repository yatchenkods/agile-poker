# Development environment values for agile-poker
# Usage: helm install agile-poker ./helm -f helm/examples/values-dev.yaml

replicaCount: 1

image:
  repository: yatchenkods/agile-poker
  tag: "latest"
  pullPolicy: Always  # Always pull in dev for latest changes

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: agile-poker.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  enabled: true
  auth:
    username: agile_dev
    password: dev_password_123
    database: agile_poker_dev
  primary:
    persistence:
      enabled: false  # Disable persistence in dev

redis:
  enabled: true
  auth:
    enabled: false  # Disable authentication in dev
  master:
    persistence:
      enabled: false  # Disable persistence in dev
  replica:
    replicaCount: 0  # No replicas in dev
  metrics:
    enabled: false  # Disable metrics in dev

frontend:
  enabled: true  # Enable frontend in dev
  replicaCount: 1
  image:
    repository: yatchenkods/agile-poker-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  healthCheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  env:
    # Use Kubernetes DNS for internal communication
    # Format: http://service-name:port
    REACT_APP_API_URL: "http://agile-poker:8000/api"
    REACT_APP_LOG_LEVEL: "debug"
    REACT_APP_JIRA_ENABLED: "true"

env:
  LOG_LEVEL: "DEBUG"
  WORKERS: "1"
  DATABASE_POOL_SIZE: "5"
  CORS_ORIGINS: "*"
  JWT_SECRET: "dev-secret-key-not-secure"
  REDIS_ENABLED: "true"
  REDIS_MAX_CONNECTIONS: "10"

secrets:
  jiraApiToken: ""
  databasePassword: "dev_password_123"
  redisPassword: ""  # No password in dev

autoscaling:
  enabled: false  # No autoscaling in dev
