# Development environment values for agile-poker
# Usage: helm install agile-poker ./helm -f helm/examples/values-dev.yaml

replicaCount: 1

image:
  repository: yatchenkods/agile-poker
  tag: "latest"
  pullPolicy: Always  # Always pull in dev for latest changes

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: agile-poker.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  enabled: true
  auth:
    username: agile_dev
    password: dev_password_123
    database: agile_poker_dev
  primary:
    persistence:
      enabled: false  # Disable persistence in dev

env:
  LOG_LEVEL: "debug"
  WORKERS: "1"
  DATABASE_POOL_SIZE: "5"
  CORS_ORIGINS: "*"
  JWT_SECRET: "dev-secret-key-not-secure"

autoscaling:
  enabled: false  # No autoscaling in dev
