{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agile-poker.fullname" . }}-frontend-init
  labels:
    {{- include "agile-poker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  init.sh: |
    #!/bin/sh
    set -e
    
    # Generate config.js from Helm values
    cat > /app/build/config.js << 'EOF'
    window.__RUNTIME_CONFIG__ = {
      REACT_APP_API_URL: '{{ .Values.frontend.env.REACT_APP_API_URL }}',
      REACT_APP_LOG_LEVEL: '{{ .Values.frontend.env.REACT_APP_LOG_LEVEL }}',
      REACT_APP_JIRA_ENABLED: '{{ .Values.frontend.env.REACT_APP_JIRA_ENABLED }}'
    };
    EOF
    
    echo "[$(date)] Config generated at /app/build/config.js"
    
    # Execute the original Docker entrypoint/command
    exec "$@"
{{- end }}
