{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agile-poker.fullname" . }}-frontend
  labels:
    {{- include "agile-poker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "agile-poker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agile-poker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: frontend
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.service.targetPort }}
          protocol: TCP
        # Use init script from ConfigMap to generate config.js before starting app
        # The init script will receive the original entrypoint as args
        command:
          - /app/init/init.sh
        # Pass the original Docker CMD/ENTRYPOINT to init script via args
        # This allows init.sh to: generate config.js, then exec "$@" to run the original command
        args:
          - npm
          - start
        {{- if .Values.frontend.healthCheck.enabled }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: {{ .Values.frontend.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.frontend.healthCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.frontend.healthCheck.timeoutSeconds }}
          failureThreshold: {{ .Values.frontend.healthCheck.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: {{ .Values.frontend.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.frontend.healthCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.frontend.healthCheck.timeoutSeconds }}
          failureThreshold: {{ .Values.frontend.healthCheck.failureThreshold }}
        {{- end }}
        env:
        {{- range $key, $value := .Values.frontend.env }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
        {{- with .Values.frontend.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        volumeMounts:
        # Mount init script from ConfigMap
        - name: init-script
          mountPath: /app/init
          readOnly: true
        {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
      # ConfigMap with initialization script
      - name: init-script
        configMap:
          name: {{ include "agile-poker.fullname" . }}-frontend-init
          defaultMode: 0755
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerances }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
