{{- if .Values.ingress.enabled }}
---
# API Ingress - routes API requests to backend service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agile-poker.fullname" . }}-api
  labels:
    {{- include "agile-poker.labels" . | nindent 4 }}
    component: api
  {{- with .Values.ingress.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    # WebSocket support annotations for NGINX Ingress Controller
    # Required for proper WebSocket protocol upgrade handling
    nginx.ingress.kubernetes.io/proxy-read-timeout: "{{ .Values.ingress.api.websocket.readTimeout }}"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "{{ .Values.ingress.api.websocket.sendTimeout }}"
    nginx.ingress.kubernetes.io/websocket-services: {{ include "agile-poker.fullname" . }}
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.api.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host }}
      secretName: {{ .Values.ingress.api.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agile-poker.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
---
# Frontend Ingress - routes frontend requests to React SPA service
{{- if and .Values.frontend .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agile-poker.fullname" . }}-frontend
  labels:
    {{- include "agile-poker.labels" . | nindent 4 }}
    component: frontend
  {{- with .Values.ingress.frontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.frontend.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.frontend.host }}
      secretName: {{ .Values.ingress.frontend.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.frontend.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agile-poker.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
{{- end }}
