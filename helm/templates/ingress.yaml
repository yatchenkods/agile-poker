{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agile-poker.fullname" . }}
  labels:
    {{- include "agile-poker.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: |
                  {{- if eq .path "/api" }}
                  {{ include "agile-poker.fullname" $ }}
                  {{- else if and $.Values.frontend $.Values.frontend.enabled }}
                  {{ include "agile-poker.fullname" $ }}-frontend
                  {{- else }}
                  {{ include "agile-poker.fullname" $ }}
                  {{- end }}
                port:
                  number: |
                    {{- if eq .path "/api" }}
                    {{ $.Values.service.port }}
                    {{- else if and $.Values.frontend $.Values.frontend.enabled }}
                    {{ $.Values.frontend.service.port }}
                    {{- else }}
                    {{ $.Values.service.port }}
                    {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
